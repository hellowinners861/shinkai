<!doctype html>
<html lang='ja'>
  <head>
    <meta charset='UTF-8' />
    <meta
      name='viewport'
      content='width=device-width, initial-scale=1.0, viewport-fit=cover'
    />
    <meta name='theme-color' content='#02070B' />
    <title>SHINKAI</title>
  </head>
  <body>
    <main id='app' aria-label='SHINKAI 深海調査記録'>
      <div id='game-container' aria-describedby='control-help'>
        <section id='title-ui' class='html-ui-layer' aria-labelledby='title-heading'>
          <div class='title-layout'>
            <header class='title-header'>
              <p class='title-kicker'>PELAGIC RESEARCH UNIT / DIVE LOG 00</p>
              <h1 id='title-heading'>SHINKAI</h1>
              <p class='title-subtitle'>深海調査記録</p>
            </header>

            <div class='title-controls'>
              <p id='control-help' class='control-help'>
                左下の操舵環を動かして調査艇を操作
              </p>
              <div class='title-status' aria-label='システム状態'>
                <span><i class='status-light' aria-hidden='true'></i>SYSTEM CHECK</span>
                <span>操舵系統 / ONLINE</span>
                <span>音響観測 / STANDBY</span>
              </div>
              <button id='start-button' class='shell-button shell-button--primary' type='button'>
                <span>潜航を開始</span>
                <span class='button-arrow' aria-hidden='true'>↗</span>
              </button>
            </div>
          </div>
        </section>

        <section id='game-ui' class='html-ui-layer' hidden aria-label='潜航計器と操作'>
          <div class='game-hud' aria-live='polite'>
            <div class='telemetry-item telemetry-item--depth'>
              <span class='telemetry-label'>DEPTH</span>
              <strong id='depth-readout'>0000 m</strong>
            </div>
            <div class='telemetry-item telemetry-item--fuel'>
              <div class='telemetry-value-row'>
                <span class='telemetry-label'>FUEL</span>
                <strong id='fuel-readout'>100.0%</strong>
              </div>
              <div
                id='fuel-meter'
                class='fuel-meter'
                role='progressbar'
                aria-label='残燃料'
                aria-valuemin='0'
                aria-valuemax='100'
                aria-valuenow='100'
              >
                <span id='fuel-meter-fill'></span>
              </div>
            </div>
          </div>
          <div class='game-actions'>
            <button
              id='pause-button'
              class='instrument-button'
              type='button'
              aria-label='一時停止'
              aria-pressed='false'
            >
              <span id='pause-glyph' class='control-glyph' aria-hidden='true'>II</span>
            </button>
            <button
              id='audio-button'
              class='instrument-button instrument-button--audio'
              type='button'
              aria-label='音声を切る'
              aria-pressed='false'
            >
              <span class='control-glyph' aria-hidden='true'>SND</span>
              <span id='audio-state' class='control-state' aria-hidden='true'>ON</span>
            </button>
          </div>
          <div id='dive-status' class='dive-status' aria-hidden='true'>
            <span>DESCENDING</span>
            <span>AUTO / 25 M/S</span>
          </div>
          <div id='pause-overlay' class='pause-overlay' hidden role='status' aria-live='polite'>
            <div class='pause-card'>
              <p class='pause-kicker'>PAUSED</p>
              <h2>潜航停止</h2>
            </div>
          </div>
          <div
            id='virtual-joystick'
            class='virtual-joystick'
            role='group'
            aria-label='操舵環。上下左右に調査艇を操作'
          >
            <span class='joystick-base' aria-hidden='true'></span>
            <span class='joystick-ring' aria-hidden='true'></span>
            <span class='joystick-tick joystick-tick--top' aria-hidden='true'></span>
            <span class='joystick-tick joystick-tick--right' aria-hidden='true'></span>
            <span class='joystick-tick joystick-tick--bottom' aria-hidden='true'></span>
            <span class='joystick-tick joystick-tick--left' aria-hidden='true'></span>
            <span class='joystick-knob' data-joystick-knob aria-hidden='true'></span>
          </div>
        </section>
      </div>

      <section id='orientation-warning' hidden role='alert' aria-live='assertive'>
        <div class='orientation-card'>
          <span class='card-status-light' aria-hidden='true'></span>
          <h2>縦画面で潜航</h2>
          <p>端末を縦向きにすると計器と操舵環が見やすくなります。</p>
          <button id='continue-landscape' class='shell-button' type='button'>
            横向きのまま続ける
          </button>
        </div>
      </section>

      <section id='resume-warning' hidden role='alert' aria-live='polite'>
        <div class='orientation-card'>
          <span class='card-status-light' aria-hidden='true'></span>
          <h2>潜航を再開しますか？</h2>
          <p>安全のため操舵を停止しました。</p>
          <button id='resume-button' class='shell-button' type='button'>
            潜航に戻る
          </button>
        </div>
      </section>

      <p id='accessibility-status' class='visually-hidden' role='status' aria-live='polite'></p>
    </main>
    <script type='module' src='/src/main.ts'></script>
  </body>
</html>
